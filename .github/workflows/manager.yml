name: Manager (WinUI 3)

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/manager/**"
      - ".github/workflows/manager.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/manager/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        arch: [x64, x86, arm64]
        include:
          - arch: x64
            rid: win-x64
          - arch: x86
            rid: win-x86
          - arch: arm64
            rid: win-arm64
      fail-fast: false

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: dotnet restore src/manager/Shell.Manager/Shell.Manager.csproj -r ${{ matrix.rid }}

    - name: Publish self-contained
      # NOTE: must build with VS MSBuild, not `dotnet` CLI - only VS ships
      # the Appx packaging tasks (RemovePayloadDuplicates) that WinUI needs.
      run: msbuild src/manager/Shell.Manager/Shell.Manager.csproj /p:Configuration=Release /p:RuntimeIdentifier=${{ matrix.rid }} /p:SelfContained=true /t:Publish /p:PublishDir="$env:GITHUB_WORKSPACE/publish/${{ matrix.arch }}/"

    - name: Copy app XBF/PRI into publish dir
      # msbuild /t:Publish leaves App.xbf/MainWindow.xbf/Shell.Manager.pri
      # in bin/ - without them the app crashes at startup (E_FAIL).
      shell: pwsh
      run: |
        $bin = "src/manager/Shell.Manager/bin/Release/net8.0-windows10.0.22621.0/${{ matrix.rid }}"
        $pub = "$env:GITHUB_WORKSPACE/publish/${{ matrix.arch }}"
        Get-ChildItem -LiteralPath $bin -File -Include *.xbf, *.pri |
          Copy-Item -Destination $pub -Force
        Get-ChildItem -LiteralPath $pub -File -Include *.xbf, *.pri |
          Select-Object Name

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: manager-${{ matrix.arch }}
        path: publish/${{ matrix.arch }}/**
        retention-days: 7
        compression-level: 6
